<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        /* Hide all odd rows */
        table tr:nth-child(odd) {
            display: none;
        }
        body {
            width: 500px;
            margin: 40px auto;
            padding: 25px;
            background-color:cornsilk;
        }

        table {
            border-collapse: collapse;
            width: 50%;
            background-color: burlywood;
        }

        td {
            border: 1px solid #333;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Table</h2>
    <table>
        <tr><td>1 row</td></tr>
        <tr><td>2 row</td></tr>
        <tr><td>3 row</td></tr>
        <tr><td>4 row</td></tr>
        <tr><td>5 row</td></tr>
        <tr><td>6 row</td></tr>
        <tr><td>7 row</td></tr>
    </table>
</body>
</html>
